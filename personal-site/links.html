<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Links | Jason Luster</title>
  <link rel="stylesheet" href="style.css">
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FLES1KD2YE"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', 'G-FLES1KD2YE');
</script>

<body>
  <header>
    <div class="container" style="justify-content: flex-end;">
      <button id="theme-toggle" aria-label="Toggle theme">Light Mode</button>
    </div>
  </header>
  <main class="container">
    <section class="link-tree-container">
      <img src="images/jason-luster.png" alt="Jason Luster" class="profile-pic">
      <h2>Jason Luster</h2>
      <p>Business Automation Manager</p>

      <div class="link-tree-nav">
        <a href="index.html" class="link-btn">About Me</a>
        <a href="resume.html" class="link-btn">View My Resume</a>
        <a href="https://www.linkedin.com/in/jason-luster/" class="link-btn" target="_blank"
          rel="noopener noreferrer">LinkedIn</a>
        <a href="https://github.com/JayRay2K5/" class="link-btn" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="mailto:jason@jluster.com" class="link-btn">Contact Me</a>
      </div>
    </section>
  </main>
  <footer>
    <p>© <span id="year"></span> Jason Luster · <a href="mailto:jason@jluster.com">jason@jluster.com</a></p>
  </footer>
  <script>
    (function () {
      const toggle = document.getElementById('theme-toggle');
      const saved = localStorage.getItem('theme');
      const theme = saved || 'light';
      document.documentElement.setAttribute('data-theme', theme);
      updateText(theme);
      toggle.addEventListener('click', () => {
        const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateText(next);
      });

      function updateText(t) {
        toggle.textContent = t === 'dark' ? '☀️ Light Theme' : '🌙 Dark Theme';
      }
      document.getElementById('year').textContent = new Date().getFullYear();
    })();
  </script>
</body>

</html>
